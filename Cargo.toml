[package]
name = "wbtransfer"
version = "0.3.0"
edition = "2021"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.22"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
